name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - src/transform.js
      - scripts/generate-calendar.js
      - scripts/templates/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Generate all country calendars
        run: node scripts/generate-calendar.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    name: Notify IndexNow
    needs: deploy
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify IndexNow
        run: |
          test "$(curl --silent --show-error --fail \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "https://oneill9.github.io/trmnl-in-season/f241b0cdcdb90be5669cfa677b1572ed.txt")" \
            = "f241b0cdcdb90be5669cfa677b1572ed"
          curl --silent --show-error --fail-with-body \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary '{
              "host": "oneill9.github.io",
              "key": "f241b0cdcdb90be5669cfa677b1572ed",
              "keyLocation": "https://oneill9.github.io/trmnl-in-season/f241b0cdcdb90be5669cfa677b1572ed.txt",
              "urlList": [
                "https://oneill9.github.io/trmnl-in-season/",
                "https://oneill9.github.io/trmnl-in-season/united-kingdom/",
                "https://oneill9.github.io/trmnl-in-season/ireland/",
                "https://oneill9.github.io/trmnl-in-season/netherlands/",
                "https://oneill9.github.io/trmnl-in-season/belgium/",
                "https://oneill9.github.io/trmnl-in-season/france/",
                "https://oneill9.github.io/trmnl-in-season/germany/",
                "https://oneill9.github.io/trmnl-in-season/united-states/",
                "https://oneill9.github.io/trmnl-in-season/canada/",
                "https://oneill9.github.io/trmnl-in-season/australia/",
                "https://oneill9.github.io/trmnl-in-season/new-zealand/"
              ]
            }'
          echo "### IndexNow" >> "$GITHUB_STEP_SUMMARY"
          echo "Notified search engines of updated pages" >> "$GITHUB_STEP_SUMMARY"
